name: CI/CD

on:
  push:
    branches: [main]

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .

      - name: Push Docker image
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret is not set"
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"

  keep-alive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Keep Render service awake
        env:
          HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          HOUR=$(TZ=Asia/Kolkata date +%H)
          MINUTE=$(TZ=Asia/Kolkata date +%M)

          CURRENT_MINUTES=$((10#$HOUR * 60 + 10#$MINUTE))

          # Keep Render awake from 06:00 AM to 01:00 AM IST.
          # Skip requests from 01:00 AM to 06:00 AM IST.
          if [ "$CURRENT_MINUTES" -ge 360 ] || [ "$CURRENT_MINUTES" -lt 60 ]; then
            if [ -z "$HEALTH_URL" ]; then
              echo "RENDER_HEALTH_URL secret is not set"
              exit 1
            fi

            echo "Pinging Render health endpoint..."
            curl -fsS "$HEALTH_URL"
          else
            echo "Night window (01:00 AM–06:00 AM IST). Skipping health check."
          fi
